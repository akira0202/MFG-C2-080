[project]
name = "mfg-c2-080"
version = "0.1.0"
description = "EquipmentFMEADraftGeneratorAgent — AgentCore Template"
requires-python = ">=3.11"
# The framework (agenticstar-agentcore) is NOT a public-PyPI dependency; it is
# provided by the environment the agent runs in. Pinning it here would make
# `pip install -e .` fail, because it is not resolvable from the default index.
# pyyaml is a real runtime dependency: the entry points import it to load
# config/config.yaml, and the PB-5 / PB-7 boundary tests read the same file.
dependencies = [
    "agenticstar-agentcore[marketplace,openai]==1.0.3",
    "pyyaml==6.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest==9.0.3",
    "pytest-cov==5.0.0",
    "pytest-asyncio==1.4.0",
    "ruff==0.4.4",
    "mypy==1.10.0",
    # pyyaml is a runtime dependency (config loading), so type-check needs its stubs.
    "types-PyYAML==6.0.12.20260518",
]

[build-system]
requires = ["setuptools==68.0.0"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
# stubs/ declares the fields of the framework's AgentState, so this template's State
# is checked as a TypedDict, NotRequired fields included.
mypy_path = "stubs"

# framework and shared are imported for their base classes and contracts; this project
# type-checks its own code, not theirs.
[[tool.mypy.overrides]]
module = ["framework", "framework.*", "shared.*"]
ignore_missing_imports = true

# Nodes, graphs and service clients here derive from framework base classes.
[[tool.mypy.overrides]]
module = ["src.*"]
disallow_subclassing_any = false

# framework / shared / langgraph は型情報（py.typed）を同梱していない。mypy はそれを
# 「スタブが見つからない」として import ごとに報告するが、これは依存側の状態であって
# このリポジトリのコードの問題ではなく、ここで直せるものでもない。標準の仕組みでその
# 報告だけを止める。これらのモジュールが Any 扱いになること自体は変わらないので、
# 「Any を継承している」「TypedDict と見なせない」といった実際の帰結は今までどおり報告される。
[[tool.mypy.overrides]]
module = ["framework.*", "shared.*", "langgraph.*"]
ignore_missing_imports = true
